name: Portability

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.91.1"
          components: rustfmt, clippy
      - name: Run the local gate on macOS
        run: cargo test
      - name: Run the codepoint scan on macOS
        run: cargo run --bin codepoint_scan
      - name: Check the formatting on macOS
        run: cargo fmt --check
      - name: Run the linter on macOS
        run: cargo clippy --all-targets -- -D warnings
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.91.1"
          components: rustfmt, clippy
      - name: Run the local gate on Windows
        run: cargo test
      - name: Run the codepoint scan on Windows
        run: cargo run --bin codepoint_scan
      - name: Check the formatting on Windows
        run: cargo fmt --check
      - name: Run the linter on Windows
        run: cargo clippy --all-targets -- -D warnings
  test-linux-secret-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.91.1"
      - name: Install system packages for the keychain backend
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config dbus gnome-keyring
      - name: Run the live Secret Service keychain round trip
        env:
          DEADBOLT_LIVE_KEYCHAIN_TEST: "1"
        run: |
          dbus-run-session -- sh -c 'printf "SYNTHETIC-TEST-VALUE-keyring-unlock\n" | gnome-keyring-daemon --unlock >/dev/null && cargo test --test custody platform_custody_round_trips_against_a_live_service_when_armed'

[package]
name = "deadbolt"
version = "0.2.0"
edition = "2021"
rust-version = "1.91"
default-run = "deadbolt"
description = "A secrets broker for agents, where a credential is enrolled once and tools redeem scoped, expiring capability tokens so the real key never touches the agent process, with the store encrypted on disk under a key the operating system keychain holds and a passphrase route as the fallback."
license = "MIT"
readme = "README.md"
repository = "https://github.com/david-engelmann/deadbolt"
homepage = "https://github.com/david-engelmann/deadbolt"
documentation = "https://docs.rs/deadbolt"
keywords = ["secrets", "credentials", "keychain", "capability", "security"]
categories = ["command-line-utilities", "cryptography"]
exclude = [".github/**"]

[lib]
name = "deadbolt"
path = "src/lib.rs"

[[bin]]
name = "deadbolt"
path = "src/bin/deadbolt.rs"

[[bin]]
name = "codepoint_scan"
path = "src/bin/codepoint_scan.rs"

[features]
custody-fixture = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
fs2 = "0.4"
getrandom = "0.3"
argon2 = "0.5"
zeroize = "1"
chacha20poly1305 = "0.10"
rpassword = "7"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service"] }

[dev-dependencies]
deadbolt = { path = ".", features = ["custody-fixture"] }
chacha20poly1305 = "0.10"

[package]
name = "deadbolt"
version = "0.1.0"
edition = "2021"
description = "Secrets brokering for agents, scoped and expiring capability tokens over one local state file"
license = "MIT"

[lib]
name = "deadbolt"
path = "src/lib.rs"

[[bin]]
name = "deadbolt"
path = "src/bin/deadbolt.rs"

[[bin]]
name = "codepoint_scan"
path = "src/bin/codepoint_scan.rs"

[features]
custody-fixture = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
fs2 = "0.4"
getrandom = "0.3"
argon2 = "0.5"
zeroize = "1"
chacha20poly1305 = "0.10"
rpassword = "7"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service"] }

[dev-dependencies]
deadbolt = { path = ".", features = ["custody-fixture"] }
chacha20poly1305 = "0.10"
